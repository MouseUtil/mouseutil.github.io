<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MouseUtil · Screenshots</title>
<link rel="stylesheet" href="theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  try{
    var p = localStorage.getItem('mouseutil-theme');
    var eff = (p === 'light' || p === 'dark') ? p : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', eff);
  }catch(e){}
})();
</script>
<style>
  *{box-sizing:border-box;}
  .display{
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    letter-spacing:-0.01em;
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.6;
  }
  .wrap{
    max-width:1440px;
    margin:0 auto;
    padding:64px 40px 72px;
  }
  h1{
    font-size:44px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 40px;
  }
  h2{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 16px;
  }
  .divider{
    border:none;
    border-top:1px solid var(--border);
    margin:0 0 28px;
  }
  /* ============ HERO CAROUSEL ============ */
  .hero-shots{
    margin-bottom:56px;
  }
  .hero-shots-carousel{
    position:relative;
  }
  /* Hero slots reuse the .shot placeholder styling (solid border, card
     background, hover state, missing-image label) exactly as-is — the
     only overrides are the 4/3 aspect ratio (instead of the screenshot's
     natural ratio) and position:relative so the "b" crossfade image can
     be absolutely positioned on top of the "a" image. */
  .hero-shot.shot{
    aspect-ratio:4/3;
    position:relative;
  }
  /* Both hero images are absolutely positioned, stacked exactly on top of
     each other and sized purely from the button's own box (which is
     fixed by aspect-ratio above). Previously only the "b" (top) image
     was absolute, leaving the "a" (bottom) image sized via normal flow —
     in some browsers a dynamic src swap on a normal-flow image can
     briefly re-derive box size from the new image's own intrinsic
     dimensions before the percentage-based CSS re-settles, producing a
     visible shrink/grow flash. Taking both images fully out of flow like
     this removes that dependency entirely: neither image's box size can
     ever be influenced by its own content, only by the button's fixed
     aspect-ratio, so the crossfade is a pure opacity fade with zero
     layout involvement. */
  .hero-img-a{
    position:absolute;
    top:0;
    left:0;
  }
  .hero-img-b{
    position:absolute;
    top:0;
    left:0;
    opacity:0;
    transition:opacity .6s ease;
  }

  /* Only the group matching the current site theme is shown, exactly like
     the dark-shot/light-shot mockup frames on index.html. This visibility
     logic now lives on the outer .hero-group wrapper (rather than directly
     on .hero-pair/.hero-single) so that each group can also own its own
     arrow overlay and dot row without those controls leaking into the
     hidden groups. */
  .hero-group{
    position:relative;
  }
  .hero-pair-group{ display:none; }
  .hero-pair-group.dark-shot{ display:block; }
  .hero-pair-group.light-shot{ display:none; }
  [data-theme="light"] .hero-pair-group.dark-shot{ display:none; }
  [data-theme="light"] .hero-pair-group.light-shot{ display:block; }

  .hero-pair{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
  }

  /* Mobile: a single screenshot at a time (cycling through all six)
     instead of the desktop's two-at-a-time pair. Hidden on desktop;
     swaps in for the pair below 640px, still gated by theme. Uses the
     same single-column grid trick as .hero-pair so the button stretches
     to fill the width instead of shrinking to its placeholder text. */
  .hero-single-group{ display:none; }
  .hero-single{
    display:grid;
    grid-template-columns:1fr;
  }

  @media (max-width:640px){
    .hero-pair-group{ display:none !important; }
    .hero-single-group.dark-shot{ display:block; }
    .hero-single-group.light-shot{ display:none; }
    [data-theme="light"] .hero-single-group.dark-shot{ display:none; }
    [data-theme="light"] .hero-single-group.light-shot{ display:block; }
  }

  /* Frame wraps just the screenshot(s), not the dots below, so the arrow
     overlay's hover area and absolute positioning stay scoped to the
     images themselves. */
  .hero-frame{
    position:relative;
  }

  /* Prev/next arrows sit on top of the screenshots (not outside them).
     Hidden by default and only revealed on hover so they don't clutter
     the hero at rest; hovering or focusing anywhere in the frame (which
     includes hovering/clicking the arrow itself, since it's positioned
     inside the frame's box) keeps them visible. */
  .hero-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:40px;
    height:40px;
    border-radius:50%;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,0.55);
    color:#fff;
    cursor:pointer;
    padding:0;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, background-color .15s ease;
    z-index:3;
  }
  .hero-arrow svg{
    width:20px;
    height:20px;
    display:block;
  }
  .hero-arrow:hover{ background:rgba(0,0,0,0.75); }
  .hero-arrow-prev{ left:14px; }
  .hero-arrow-next{ right:14px; }

  .hero-frame:hover .hero-arrow{
    opacity:1;
    pointer-events:auto;
  }
  /* :focus-visible (not :focus-within) so keyboard tabbing to an arrow
     keeps it visible, but clicking it with a mouse does not — a clicked
     button stays focused afterward, and focus-within would otherwise keep
     the arrows stuck visible even after the pointer leaves the hero area. */
  .hero-arrow:focus-visible{
    opacity:1;
    pointer-events:auto;
  }

  /* Progress dots: 3 for the desktop pair (three stages of two images
     each), 6 for the mobile single (one stage per screenshot). */
  .hero-dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:18px;
  }
  .hero-dot{
    width:8px;
    height:8px;
    padding:0;
    border:none;
    border-radius:50%;
    background:var(--border);
    cursor:pointer;
    transition:background-color .18s ease, transform .18s ease;
  }
  .hero-dot:hover{ background:var(--muted); }
  .hero-dot.active{
    background:var(--icon-accent);
    transform:scale(1.3);
  }

  @media (max-width:640px){
    /* Arrows are always visible on touch/small screens, since there's no
       hover state to reveal them. */
    .hero-arrow{
      opacity:1;
      pointer-events:auto;
      width:36px;
      height:36px;
    }
    .hero-arrow-prev{ left:10px; }
    .hero-arrow-next{ right:10px; }
  }

  /* Mobile and portrait tablets: the hero container switches to the same
     tall aspect ratio as the regular screenshots below, instead of the
     desktop's 4:3. The screenshots themselves are still 4:3 images, so
     they're cropped (object-fit:cover) to fill the taller frame rather
     than stretched. Desktop sizing above this breakpoint is untouched. */
  @media (max-width:1024px){
    .hero-shot.shot{ aspect-ratio:582/750; }
    .hero-shot.shot .hero-img-a,
    .hero-shot.shot .hero-img-b{ object-fit:cover; }
  }

  .shots-sections{
    display:flex;
    flex-direction:column;
  }
  section{
    margin-bottom:48px;
  }
  /* Default (light theme, or no theme set yet): light screenshots first. */
  .light-section{ order:1; }
  .dark-section{ order:2; }
  /* Dark theme: dark screenshots first. Reacts live to data-theme changes
     on <html>, so switching the theme toggle reorders instantly with no JS. */
  [data-theme="dark"] .light-section{ order:2; }
  [data-theme="dark"] .dark-section{ order:1; }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
  }
  .shot{
    aspect-ratio:582/750;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:0;
    cursor:pointer;
    font:inherit;
    color:inherit;
    transition:border-color .15s ease;
  }
  .shot:hover{
    border-color:var(--icon-accent);
  }
  .shot img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .shot .placeholder-label{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:0 12px;
  }
  #lightbox{
    border:none;
    background:transparent;
    padding:0;
    max-width:none;
    max-height:none;
  }
  #lightbox::backdrop{
    background:rgba(0,0,0,0.82);
  }
  #lightbox img{
    display:block;
    max-width:88vw;
    max-height:88vh;
    margin:0 auto;
    border-radius:10px;
  }
  #lightbox-close{
    position:fixed;
    top:20px;
    right:20px;
  }
  #lightbox-prev{
    position:fixed;
    left:20px;
    top:50%;
    transform:translateY(-50%);
  }
  #lightbox-next{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
  }
  @media (max-width:1100px){
    .grid{grid-template-columns:repeat(2, 1fr);}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:1fr;}
    .wrap{padding:48px 20px 48px;}
    h1{font-size:34px;}
  }

  /* ============ FOOTER ============ */
  /* shared footer styles live in theme.css; this page's content column is wider */
  .footer-inner{ max-width:1440px; padding:0 40px; }
  @media (max-width:640px){
    .footer-inner{ padding:0 20px; }
  }
</style>
</head>

  <script>
  (function(){
    var trail = document.getElementById('breadcrumb-trail');
    var title = document.getElementById('page-title');
    if (!trail || !title) return;

    var visible = false;
    var hideTimer = null;

    function show(){
      if (visible) return;
      visible = true;
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      trail.style.display = 'flex';
      // Force reflow so the opacity transition runs instead of jumping straight to visible.
      trail.offsetHeight;
      trail.classList.add('visible');
    }

    function hide(){
      if (!visible) return;
      visible = false;
      trail.classList.remove('visible');
      // Wait for the fade-out to finish before collapsing the layout space,
      // so the card shrinks back down only once the text has faded.
      hideTimer = setTimeout(function(){
        trail.style.display = 'none';
        hideTimer = null;
      }, 200);
    }

    function onScroll(){
      var threshold = title.getBoundingClientRect().bottom + window.scrollY;
      if (window.scrollY > threshold){ show(); } else { hide(); }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();
  </script>
  <script>
  (function(){
    var heroImagesDark = [
      'screenshots/hero-dark-1.png',
      'screenshots/hero-dark-2.png',
      'screenshots/hero-dark-3.png',
      'screenshots/hero-dark-4.png',
      'screenshots/hero-dark-5.png',
      'screenshots/hero-dark-6.png'
    ];
    var heroImagesLight = [
      'screenshots/hero-light-1.png',
      'screenshots/hero-light-2.png',
      'screenshots/hero-light-3.png',
      'screenshots/hero-light-4.png',
      'screenshots/hero-light-5.png',
      'screenshots/hero-light-6.png'
    ];

    // Exactly the crossfade mechanism used by the index.html hero mockup:
    // the "b" image is loaded with the next screenshot, faded in over the
    // "a" image, then once the fade finishes "a" is updated to match and
    // "b" is snapped back to invisible with no transition — ready to fade
    // in the next screenshot.
    function crossfadeTo(base, overlay, nextSrc){
      overlay.src = nextSrc;
      requestAnimationFrame(function(){
        overlay.style.opacity = '1';
      });
      setTimeout(function(){
        base.src = overlay.src;
        overlay.style.transition = 'none';
        overlay.style.opacity = '0';
        overlay.offsetHeight;
        overlay.style.transition = '';
      }, 650);
    }

    function slot(baseId, overlayId, images){
      var base = document.getElementById(baseId);
      var overlay = document.getElementById(overlayId);
      if (!base || !overlay) return null;
      return { base: base, overlay: overlay, images: images };
    }

    // Builds one carousel controller for a stage-count group (the desktop
    // pair or the mobile single). Crucially this owns a SINGLE shared stage
    // and timer for both the dark and light image sets together — dark and
    // light must always be showing the same stage number, so that flipping
    // the theme mid-carousel reveals the equivalent screenshot (e.g.
    // hero-light-3 visible -> switch to dark -> hero-dark-3 appears), the
    // same way the original always-in-lockstep auto-advance worked. Both
    // themes' dots/arrows are wired to this same shared state, since only
    // one theme's controls are ever visible/clickable at once but they
    // both need to move the same underlying stage.
    function createCarousel(opts){
      var slots = opts.slots; // dark + light slots together
      var stageCount = opts.stageCount;
      var stage = 0;
      var timer = null;
      var dotGroups = []; // one array of dot elements per dots container (dark + light)

      function updateDots(){
        dotGroups.forEach(function(dots){
          dots.forEach(function(dot, i){
            var active = i === stage;
            dot.classList.toggle('active', active);
            dot.setAttribute('aria-selected', active ? 'true' : 'false');
          });
        });
      }

      // Crossfades every slot (both themes) to the given stage and updates
      // all dot rows. Used for every navigation *after* the initial render,
      // so the page never plays a crossfade animation just from loading.
      function goTo(newStage){
        stage = ((newStage % stageCount) + stageCount) % stageCount;
        slots.forEach(function(s){
          crossfadeTo(s.base, s.overlay, s.images[stage]);
        });
        updateDots();
      }
      function next(){ goTo(stage + 1); }
      function prev(){ goTo(stage - 1); }

      function stopAuto(){
        if (timer){ clearInterval(timer); timer = null; }
      }
      // Restarts the auto-advance countdown from zero. Called after any
      // manual navigation (arrow or dot, on either theme) so the carousel
      // doesn't jump to the next stage again right after the user just
      // switched it.
      function resetAuto(){
        stopAuto();
        timer = setInterval(next, opts.intervalMs);
      }

      (opts.dotsEls || []).forEach(function(dotsEl){
        if (!dotsEl) return;
        var dots = [];
        for (var i = 0; i < stageCount; i++){
          var dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'hero-dot';
          dot.setAttribute('role', 'tab');
          dot.setAttribute('aria-label', opts.pairedSlots ? 'Show screenshots, stage ' + (i + 1) : 'Show screenshot ' + (i + 1));
          (function(idx){
            dot.addEventListener('click', function(e){
              e.stopPropagation();
              goTo(idx);
              resetAuto();
            });
          })(i);
          dotsEl.appendChild(dot);
          dots.push(dot);
        }
        dotGroups.push(dots);
      });
      updateDots();

      (opts.prevEls || []).forEach(function(el){
        if (!el) return;
        el.addEventListener('click', function(e){
          e.stopPropagation();
          prev();
          resetAuto();
        });
      });
      (opts.nextEls || []).forEach(function(el){
        if (!el) return;
        el.addEventListener('click', function(e){
          e.stopPropagation();
          next();
          resetAuto();
        });
      });

      return {
        // Kicks off the very first auto-advance countdown. Kept separate
        // from resetAuto so callers can stagger the initial delay.
        start: function(){ resetAuto(); }
      };
    }

    // Left slot cycles 1 -> 3 -> 5, right slot cycles 2 -> 4 -> 6 (desktop,
    // two-at-a-time), same stage for both dark and light. The mobile single
    // slot instead cycles through all six screenshots in order, one at a
    // time, again with dark and light sharing the same stage.
    var pairCarousel = createCarousel({
      slots: [
        slot('hero-dark-a1', 'hero-dark-b1', [heroImagesDark[0], heroImagesDark[2], heroImagesDark[4]]),
        slot('hero-dark-a2', 'hero-dark-b2', [heroImagesDark[1], heroImagesDark[3], heroImagesDark[5]]),
        slot('hero-light-a1', 'hero-light-b1', [heroImagesLight[0], heroImagesLight[2], heroImagesLight[4]]),
        slot('hero-light-a2', 'hero-light-b2', [heroImagesLight[1], heroImagesLight[3], heroImagesLight[5]])
      ].filter(Boolean),
      stageCount: 3,
      intervalMs: 5000,
      pairedSlots: true,
      dotsEls: [document.getElementById('hero-dark-pair-dots'), document.getElementById('hero-light-pair-dots')],
      prevEls: [document.getElementById('hero-dark-pair-prev'), document.getElementById('hero-light-pair-prev')],
      nextEls: [document.getElementById('hero-dark-pair-next'), document.getElementById('hero-light-pair-next')]
    });
    var singleCarousel = createCarousel({
      slots: [
        slot('hero-dark-single-a', 'hero-dark-single-b', heroImagesDark),
        slot('hero-light-single-a', 'hero-light-single-b', heroImagesLight)
      ].filter(Boolean),
      stageCount: 6,
      intervalMs: 3000,
      pairedSlots: false,
      dotsEls: [document.getElementById('hero-dark-single-dots'), document.getElementById('hero-light-single-dots')],
      prevEls: [document.getElementById('hero-dark-single-prev'), document.getElementById('hero-light-single-prev')],
      nextEls: [document.getElementById('hero-dark-single-next'), document.getElementById('hero-light-single-next')]
    });

    // Same 2s head start the hero always had before its first auto-advance,
    // so the screenshots aren't already mid-fade the instant the page loads.
    setTimeout(function(){
      pairCarousel.start();
      singleCarousel.start();
    }, 2000);

    // Clicking a screenshot opens it in the lightbox. Which theme's list
    // to use, and which image in it, is read off the frame that was
    // actually clicked (its currently-settled "a" image). Match by
    // filename rather than the raw src string: once a crossfade swap has
    // run, base.src gets reassigned via the DOM property (base.src =
    // overlay.src), which the browser normalizes into an absolute URL —
    // that no longer string-matches the relative paths in heroImagesDark/
    // heroImagesLight, so comparing basenames keeps this correct
    // regardless of how the src attribute happens to be formatted.
    document.querySelectorAll('.hero-pair, .hero-single').forEach(function(group){
      group.addEventListener('click', function(e){
        var btn = e.target.closest ? e.target.closest('.hero-shot') : null;
        if (!btn) return;
        var base = btn.querySelector('.hero-img-a');
        if (!base) return;
        var heroGroup = group.closest('.hero-group');
        var list = heroGroup && heroGroup.classList.contains('light-shot') ? heroImagesLight : heroImagesDark;
        var currentFile = (base.getAttribute('src') || '').split('/').pop();
        var idx = list.findIndex(function(url){ return url.split('/').pop() === currentFile; });
        if (idx === -1) idx = 0;
        if (typeof window.openLightboxGallery === 'function') {
          window.openLightboxGallery(list, idx);
        }
      });
    });
  })();
  </script>
  <script>
  (function(){
    var mainImages = [
      'screenshots/light-1.png','screenshots/light-2.png','screenshots/light-3.png','screenshots/light-4.png',
      'screenshots/dark-1.png','screenshots/dark-2.png','screenshots/dark-3.png','screenshots/dark-4.png'
    ];
    var images = mainImages;
    var dialog = document.getElementById('lightbox');
    var imgEl = document.getElementById('lightbox-img');
    var current = 0;

    function show(index){
      current = (index + images.length) % images.length;
      imgEl.src = images[current];
    }
    function openAt(index){
      show(index);
      if (typeof dialog.showModal === 'function') dialog.showModal();
    }
    function next(){ show(current + 1); }
    function prev(){ show(current - 1); }

    // Allows other galleries on the page (e.g. the hero carousel) to reuse
    // this same lightbox dialog with their own image list.
    window.openLightboxGallery = function(list, index){
      images = list;
      openAt(index);
    };

    document.querySelectorAll('.shot').forEach(function(shot){
      shot.addEventListener('click', function(){
        images = mainImages;
        openAt(parseInt(shot.getAttribute('data-index'), 10));
      });
    });

    document.getElementById('lightbox-next').addEventListener('click', function(e){ e.stopPropagation(); next(); });
    document.getElementById('lightbox-prev').addEventListener('click', function(e){ e.stopPropagation(); prev(); });
    document.getElementById('lightbox-close').addEventListener('click', function(){ dialog.close(); });

    // Click on the backdrop (outside the dialog's content) closes it.
    dialog.addEventListener('click', function(e){
      if (e.target === dialog) dialog.close();
    });

    // Escape-to-close is native <dialog> behavior. Arrow keys navigate.
    dialog.addEventListener('keydown', function(e){
      if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    });
  })();
  </script>
