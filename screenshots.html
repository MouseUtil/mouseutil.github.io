<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screenshots · MouseUtil</title>
<link rel="stylesheet" href="theme.css">
<script>
(function(){
  try{
    var p = localStorage.getItem('mouseutil-theme');
    var eff = (p === 'light' || p === 'dark') ? p : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', eff);
  }catch(e){}
})();
</script>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.6;
  }
  .wrap{
    max-width:1440px;
    margin:0 auto;
    padding:64px 40px 72px;
  }
  h1{
    font-size:44px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 40px;
  }
  h2{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 16px;
  }
  .divider{
    border:none;
    border-top:1px solid var(--border);
    margin:0 0 28px;
  }
  section{
    margin-bottom:48px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
  }
  .shot{
    aspect-ratio:280/280;
    border:1px dashed var(--border);
    border-radius:10px;
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .shot img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .shot .placeholder-label{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:0 12px;
  }
  @media (max-width:1100px){
    .grid{grid-template-columns:repeat(2, 1fr);}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:1fr;}
    .wrap{padding:48px 20px 48px;}
    h1{font-size:34px;}
  }
  .footer{
    display:flex;
    justify-content:center;
    margin-top:16px;
    padding-bottom:48px;
  }
  .footer a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--text);
    text-decoration:none;
    font-size:15px;
    font-weight:600;
  }
  .footer a:hover{
    color:var(--muted);
  }
  .footer svg{
    width:16px;
    height:16px;
    fill:var(--muted);
    flex-shrink:0;
  }
</style>
</head>
<body>
  <div class="theme-switcher">
    <button id="theme-toggle" aria-haspopup="listbox" aria-expanded="false" aria-label="Change theme">
      <span class="theme-icon" aria-hidden="true"></span>
    </button>
    <div class="theme-menu" id="theme-menu" role="listbox">
      <button class="theme-option" data-value="light" role="option" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <span>Light</span>
      </button>
      <button class="theme-option" data-value="dark" role="option" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <span>Dark</span>
      </button>
      <button class="theme-option" data-value="system" role="option" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        <span>System</span>
      </button>
    </div>
  </div>
  <div class="wrap">
    <h1>Screenshots</h1>

    <section>
      <h2>Light mode</h2>
      <hr class="divider">
      <div class="grid">
        <div class="shot"><img src="screenshots/light-1.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="placeholder-label" style="display:none;">light-1.png</span></div>
        <div class="shot"><img src="screenshots/light-2.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="placeholder-label" style="display:none;">light-2.png</span></div>
        <div class="shot"><img src="screenshots/light-3.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="placeholder-label" style="display:none;">light-3.png</span></div>
        <div class="shot"><img src="screenshots/light-4.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="placeholder-label" style="display:none;">light-4.png</span></div>
      </div>
    </section>

    <section>
      <h2>Dark mode</h2>
      <hr class="divider">
      <div class="grid">
        <div class="shot"><img src="screenshots/dark-1.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="placeholder-label" style="display:none;">dark-1.png</span></div>
        <div class="shot"><img src="screenshots/dark-2.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="placeholder-label" style="display:none;">dark-2.png</span></div>
        <div class="shot"><img src="screenshots/dark-3.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="placeholder-label" style="display:none;">dark-3.png</span></div>
        <div class="shot"><img src="screenshots/dark-4.png" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="placeholder-label" style="display:none;">dark-4.png</span></div>
      </div>
    </section>
  </div>

  <div class="footer">
    <a href="https://github.com/MouseUtil/MouseUtil">
      <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.11.81 2.25 0 1.635-.015 2.945-.015 3.35 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      GitHub
    </a>
  </div>
  <script src="theme.js"></script>
</body>
</html>
