<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screenshots · MouseUtil</title>
<link rel="stylesheet" href="theme.css">
<script>
(function(){
  try{
    var p = localStorage.getItem('mouseutil-theme');
    var eff = (p === 'light' || p === 'dark') ? p : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', eff);
  }catch(e){}
})();
</script>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.6;
  }
  .wrap{
    max-width:1440px;
    margin:0 auto;
    padding:64px 40px 72px;
  }
  h1{
    font-size:44px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 40px;
  }
  h2{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 16px;
  }
  .divider{
    border:none;
    border-top:1px solid var(--border);
    margin:0 0 28px;
  }
  /* ============ HERO CAROUSEL ============ */
  .hero-shots{
    margin-bottom:56px;
  }
  .hero-shots-carousel{
    position:relative;
  }
  .hero-shots-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:2;
  }
  .hero-shots-arrow.hero-shots-prev{ left:-56px; }
  .hero-shots-arrow.hero-shots-next{ right:-56px; }
  .hero-shots-arrow:active{ transform:translateY(-50%); }
  /* The .wrap container maxes out at 1440px with 40px side padding, so
     there's only ever guaranteed to be 40px of clearance outside the
     carousel once the window is narrower than that. Below the width where
     a 56px offset would actually have room, pull the arrows in so they
     never get clipped by the viewport edge. */
  @media (max-width:1472px){
    .hero-shots-arrow.hero-shots-prev{ left:-32px; }
    .hero-shots-arrow.hero-shots-next{ right:-32px; }
  }
  .hero-shot{
    display:block;
    padding:0;
    border:none;
    background:none;
    font:inherit;
    color:inherit;
    cursor:pointer;
  }
  .hero-shot img{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:4/3;
    object-fit:cover;
    border-radius:6px;
    border:1px solid var(--border);
    transition:border-color .15s ease;
  }
  .hero-shot:hover img{ border-color:var(--icon-accent); }

  /* Desktop: two fixed rows (dark pair / light pair), only one shown. */
  .hero-desktop-view{ display:block; }
  .hero-row{
    display:none;
    grid-template-columns:repeat(2, 1fr);
    gap:20px;
    transition:transform .32s ease, opacity .32s ease;
    transform:translateX(0);
    opacity:1;
  }
  .hero-desktop-view[data-view="dark"] .hero-row.dark-row{ display:grid; }
  .hero-desktop-view[data-view="light"] .hero-row.light-row{ display:grid; }
  .hero-row.shots-shift-left{ transform:translateX(-18px); opacity:0; }
  .hero-row.shots-shift-right{ transform:translateX(18px); opacity:0; }

  /* Mobile: four fixed single-image slides, only one shown. */
  .hero-mobile-view{ display:none; }
  .hero-slide{
    display:none;
    transition:transform .32s ease, opacity .32s ease;
    transform:translateX(0);
    opacity:1;
  }
  .hero-mobile-view[data-view="0"] .hero-slide[data-slide="0"]{ display:block; }
  .hero-mobile-view[data-view="1"] .hero-slide[data-slide="1"]{ display:block; }
  .hero-mobile-view[data-view="2"] .hero-slide[data-slide="2"]{ display:block; }
  .hero-mobile-view[data-view="3"] .hero-slide[data-slide="3"]{ display:block; }
  .hero-slide.shots-shift-left{ transform:translateX(-18px); opacity:0; }
  .hero-slide.shots-shift-right{ transform:translateX(18px); opacity:0; }

  @media (max-width:640px){
    .hero-shots-arrow.hero-shots-prev{ left:-14px; }
    .hero-shots-arrow.hero-shots-next{ right:-14px; }
    .hero-desktop-view{ display:none; }
    .hero-mobile-view{ display:block; }
  }

  .shots-sections{
    display:flex;
    flex-direction:column;
  }
  section{
    margin-bottom:48px;
  }
  /* Default (light theme, or no theme set yet): light screenshots first. */
  .light-section{ order:1; }
  .dark-section{ order:2; }
  /* Dark theme: dark screenshots first. Reacts live to data-theme changes
     on <html>, so switching the theme toggle reorders instantly with no JS. */
  [data-theme="dark"] .light-section{ order:2; }
  [data-theme="dark"] .dark-section{ order:1; }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:20px;
  }
  .shot{
    aspect-ratio:582/855;
    border:1px dashed var(--border);
    border-radius:8px;
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:0;
    cursor:pointer;
    font:inherit;
    color:inherit;
    transition:border-color .15s ease;
  }
  .shot:hover{
    border-color:var(--icon-accent);
  }
  .shot img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .shot .placeholder-label{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:0 12px;
  }
  #lightbox{
    border:none;
    background:transparent;
    padding:0;
    max-width:none;
    max-height:none;
  }
  #lightbox::backdrop{
    background:rgba(0,0,0,0.82);
  }
  #lightbox img{
    display:block;
    max-width:88vw;
    max-height:88vh;
    margin:0 auto;
    border-radius:10px;
  }
  #lightbox-close{
    position:fixed;
    top:20px;
    right:20px;
  }
  #lightbox-prev{
    position:fixed;
    left:20px;
    top:50%;
    transform:translateY(-50%);
  }
  #lightbox-next{
    position:fixed;
    right:20px;
    top:50%;
    transform:translateY(-50%);
  }
  @media (max-width:1100px){
    .grid{grid-template-columns:repeat(2, 1fr);}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:1fr;}
    .wrap{padding:48px 20px 48px;}
    h1{font-size:34px;}
  }

  /* ============ FOOTER ============ */
  /* shared footer styles live in theme.css; this page's content column is wider */
  .footer-inner{ max-width:1440px; padding:0 40px; }
  @media (max-width:640px){
    .footer-inner{ padding:0 20px; }
  }
</style>

  <script>
  (function(){
    var hero = document.getElementById('hero-shots');
    var desktopView = document.getElementById('hero-desktop-view');
    var mobileView = document.getElementById('hero-mobile-view');
    var prevBtn = document.getElementById('hero-shots-prev');
    var nextBtn = document.getElementById('hero-shots-next');
    if (!hero || !desktopView || !mobileView || !prevBtn || !nextBtn) return;

    var heroImages = [
      'screenshots/hero-dark-1.png',
      'screenshots/hero-dark-2.png',
      'screenshots/hero-light-1.png',
      'screenshots/hero-light-2.png'
    ];

    var mobileQuery = window.matchMedia('(max-width:640px)');
    var desktopAnimating = false;
    var mobileAnimating = false;

    function updateAria(){
      if (mobileQuery.matches) {
        prevBtn.setAttribute('aria-label', 'Show previous screenshot');
        nextBtn.setAttribute('aria-label', 'Show next screenshot');
      } else {
        var current = desktopView.getAttribute('data-view');
        var otherLabel = current === 'dark' ? 'light' : 'dark';
        var aria = 'Show ' + otherLabel + ' mode screenshots';
        prevBtn.setAttribute('aria-label', aria);
        nextBtn.setAttribute('aria-label', aria);
      }
    }

    // ---- Desktop: two fixed rows (dark pair / light pair). ----
    // Mirrors the exact mechanism used by the shots carousel on index.html.
    function switchDesktop(direction){
      if (desktopAnimating) return;
      var current = desktopView.getAttribute('data-view');
      var next = current === 'dark' ? 'light' : 'dark';
      var currentRow = desktopView.querySelector('.hero-row.' + current + '-row');
      var nextRow = desktopView.querySelector('.hero-row.' + next + '-row');
      if (!currentRow || !nextRow) return;

      desktopAnimating = true;
      var exitClass = direction === 'next' ? 'shots-shift-left' : 'shots-shift-right';
      var enterFromClass = direction === 'next' ? 'shots-shift-right' : 'shots-shift-left';

      currentRow.classList.add(exitClass);

      setTimeout(function(){
        nextRow.classList.add(enterFromClass);
        desktopView.setAttribute('data-view', next);
        updateAria();
        currentRow.classList.remove(exitClass);

        nextRow.offsetHeight;
        requestAnimationFrame(function(){
          nextRow.classList.remove(enterFromClass);
        });

        setTimeout(function(){ desktopAnimating = false; }, 320);
      }, 320);
    }

    // ---- Mobile: four fixed single-image slides. ----
    // Same mechanism as above, generalized from 2 states to 4.
    function switchMobile(direction){
      if (mobileAnimating) return;
      var current = parseInt(mobileView.getAttribute('data-view'), 10);
      var next = (current + (direction === 'next' ? 1 : -1) + 4) % 4;
      var currentSlide = mobileView.querySelector('.hero-slide[data-slide="' + current + '"]');
      var nextSlide = mobileView.querySelector('.hero-slide[data-slide="' + next + '"]');
      if (!currentSlide || !nextSlide) return;

      mobileAnimating = true;
      var exitClass = direction === 'next' ? 'shots-shift-left' : 'shots-shift-right';
      var enterFromClass = direction === 'next' ? 'shots-shift-right' : 'shots-shift-left';

      currentSlide.classList.add(exitClass);

      setTimeout(function(){
        nextSlide.classList.add(enterFromClass);
        mobileView.setAttribute('data-view', String(next));
        currentSlide.classList.remove(exitClass);

        nextSlide.offsetHeight;
        requestAnimationFrame(function(){
          nextSlide.classList.remove(enterFromClass);
        });

        setTimeout(function(){ mobileAnimating = false; }, 320);
      }, 320);
    }

    hero.addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('.hero-shot') : null;
      if (!btn) return;
      var idx = parseInt(btn.getAttribute('data-hero-index'), 10);
      if (!isNaN(idx) && typeof window.openLightboxGallery === 'function') {
        window.openLightboxGallery(heroImages, idx);
      }
    });

    // Start in sync with the site's current theme.
    var initial = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    desktopView.setAttribute('data-view', initial);
    mobileView.setAttribute('data-view', initial === 'light' ? '2' : '0');
    updateAria();

    prevBtn.addEventListener('click', function(){
      if (mobileQuery.matches) switchMobile('prev'); else switchDesktop('prev');
    });
    nextBtn.addEventListener('click', function(){
      if (mobileQuery.matches) switchMobile('next'); else switchDesktop('next');
    });

    // Re-sync to the theme whenever it changes, overriding any manual
    // switching the user did with the arrows.
    var themeObserver = new MutationObserver(function(){
      var theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      if (desktopView.getAttribute('data-view') !== theme) {
        desktopView.setAttribute('data-view', theme);
      }
      var mobileTheme = parseInt(mobileView.getAttribute('data-view'), 10) < 2 ? 'dark' : 'light';
      if (mobileTheme !== theme) {
        var slot = parseInt(mobileView.getAttribute('data-view'), 10) % 2;
        mobileView.setAttribute('data-view', String((theme === 'dark' ? 0 : 2) + slot));
      }
      updateAria();
    });
    themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    if (mobileQuery.addEventListener) {
      mobileQuery.addEventListener('change', updateAria);
    } else if (mobileQuery.addListener) {
      mobileQuery.addListener(updateAria);
    }
  })();
  </script>
  <script>
  (function(){
    var mainImages = [
      'screenshots/light-1.png','screenshots/light-2.png','screenshots/light-3.png','screenshots/light-4.png',
      'screenshots/dark-1.png','screenshots/dark-2.png','screenshots/dark-3.png','screenshots/dark-4.png'
    ];
    var images = mainImages;
    var dialog = document.getElementById('lightbox');
    var imgEl = document.getElementById('lightbox-img');
    var current = 0;

    function show(index){
      current = (index + images.length) % images.length;
      imgEl.src = images[current];
    }
    function openAt(index){
      show(index);
      if (typeof dialog.showModal === 'function') dialog.showModal();
    }
    function next(){ show(current + 1); }
    function prev(){ show(current - 1); }

    // Allows other galleries on the page (e.g. the hero carousel) to reuse
    // this same lightbox dialog with their own image list.
    window.openLightboxGallery = function(list, index){
      images = list;
      openAt(index);
    };

    document.querySelectorAll('.shot').forEach(function(shot){
      shot.addEventListener('click', function(){
        images = mainImages;
        openAt(parseInt(shot.getAttribute('data-index'), 10));
      });
    });

    document.getElementById('lightbox-next').addEventListener('click', function(e){ e.stopPropagation(); next(); });
    document.getElementById('lightbox-prev').addEventListener('click', function(e){ e.stopPropagation(); prev(); });
    document.getElementById('lightbox-close').addEventListener('click', function(){ dialog.close(); });

    // Click on the backdrop (outside the dialog's content) closes it.
    dialog.addEventListener('click', function(e){
      if (e.target === dialog) dialog.close();
    });

    // Escape-to-close is native <dialog> behavior. Arrow keys navigate.
    dialog.addEventListener('keydown', function(e){
      if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    });
  })();
  </script>
</body>
</html>
